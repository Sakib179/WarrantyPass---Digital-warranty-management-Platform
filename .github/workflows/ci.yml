name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: warrantypass_test
          POSTGRES_USER: warrantypass
          POSTGRES_PASSWORD: warrantypass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warrantypass -d warrantypass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://warrantypass:warrantypass_test@localhost:5432/warrantypass_test
      TEST_DATABASE_URL: postgresql://warrantypass:warrantypass_test@localhost:5432/warrantypass_test
      API_PORT: 4000
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: silent
      TRUST_PROXY: 'false'
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 120
      JSON_BODY_LIMIT: 1mb
      AUTH_ACCESS_TOKEN_SECRET: ci-access-secret-with-at-least-thirty-two-characters
      AUTH_REFRESH_TOKEN_SECRET: ci-refresh-secret-with-at-least-thirty-two-characters
      AUTH_COOKIE_SECURE: 'false'
      AUTH_COOKIE_SAME_SITE: strict
      EMAIL_PROVIDER: memory
      RATE_LIMIT_STORE: memory
      STORAGE_PROVIDER: local
      WARRANTY_DOCUMENT_MAX_BYTES: 10485760
      WARRANTY_EXPIRING_SOON_DAYS: 30
      DOCUMENT_EXTRACTION_PROVIDER: mock
      BILLING_PROVIDER: mock
      BILLING_WEBHOOK_SECRET: ci-billing-webhook-secret-at-least-thirty-two
      LOCAL_STORAGE_PATH: ./uploads
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run unit and API tests
        run: pnpm test

      - name: Build production applications
        run: pnpm build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
